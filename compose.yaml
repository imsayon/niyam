services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: niyam
      POSTGRES_PASSWORD: niyam-local-only
      POSTGRES_DB: niyam
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niyam -d niyam"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  data:
