name: Verify, package and release Niyam
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niyam
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: niyam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://niyam:ci-only-password@localhost:5432/niyam_test
      - run: npm run build

  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pkg set "version=0.2.${{ github.run_number }}" --prefix desktop
      - run: npm run desktop:win -- --publish never
      - name: Install and verify Windows client
        shell: pwsh
        env:
          NIYAM_ADMIN_PASSWORD: ${{ secrets.NIYAM_ADMIN_PASSWORD }}
        run: |
          $installer = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter Niyam.exe -Recurse | Select-Object -First 1
          if (-not $installed) { throw 'Installer did not create Niyam.exe' }
          $env:NIYAM_DESKTOP_PATH = $installed.FullName
          node scripts/desktop-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-verification
          path: local/desktop-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: Niyam-Windows-x64
          path: release/*.exe
          retention-days: 30

  linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pkg set "version=0.2.${{ github.run_number }}" --prefix desktop
      - run: npm run desktop:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Niyam-Linux-x64
          path: release/*.AppImage
          retention-days: 30

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [verify, windows, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Niyam-*
          path: release
          merge-multiple: true
      - name: Checksum assets
        run: cd release && sha256sum *.exe *.AppImage > SHA256SUMS
      - name: Publish release in the source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.2.${{ github.run_number }}"             release/*.exe release/*.AppImage release/SHA256SUMS             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "Niyam 0.2.${{ github.run_number }}"             --notes "Automated Windows and Linux builds from verified commit ${{ github.sha }}. Windows is unsigned and requires an internet connection. Google desktop sign-in uses an approved system-browser handoff."
