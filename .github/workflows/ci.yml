name: Verify and package Niyam
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niyam
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: niyam_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://niyam:ci-only-password@localhost:5432/niyam_test
      - run: npm run build
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:win -- --publish never
      - name: Install and verify Windows client
        if: github.event_name == 'push'
        shell: pwsh
        env:
          NIYAM_STUDENT_PASSWORD: ${{ secrets.NIYAM_STUDENT_PASSWORD }}
        run: |
          $installer = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter Niyam.exe -Recurse | Select-Object -First 1
          if (-not $installed) { throw 'Installer did not create Niyam.exe' }
          $env:NIYAM_DESKTOP_PATH = $installed.FullName
          node scripts/desktop-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-verification
          path: local/desktop-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: Niyam-Windows-x64
          path: release/*.exe
          retention-days: 14
  linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Niyam-Linux-x64
          path: release/*.AppImage
          retention-days: 14
