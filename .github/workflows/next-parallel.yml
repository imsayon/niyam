name: Niyam Next migration preview
on:
  pull_request:
    paths:
      - "next-app/**"
      - "server/api-only.js"
      - ".github/workflows/next-parallel.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  next-preview:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niyam
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: niyam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://niyam:ci-only-password@127.0.0.1:5432/niyam_test
      NIYAM_SANDBOX: "1"
      NIYAM_LEGACY_API_ORIGIN: http://127.0.0.1:4317
      PUBLIC_ORIGIN: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install stable baseline
        run: npm ci
      - name: Install Next preview dependencies
        run: npm install --prefix next-app --no-audit --no-fund
      - name: Emit dependency lockfile for precise review
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const text = readFileSync("next-app/package-lock.json", "utf8");
          const size = 3000;
          for (let i = 0; i * size < text.length; i++)
            console.log("NIYAM_LOCK_CHUNK " + i + " " + encodeURIComponent(text.slice(i * size, (i + 1) * size)));
          console.log("NIYAM_LOCK_END " + Math.ceil(text.length / size) + " " + text.length);
          NODE
      - name: Build Next App Router without unresolved imports
        run: |
          set -o pipefail
          npm run build --prefix next-app 2>&1 | tee next-build.log
          if grep -F "Module not found: Can't resolve" next-build.log; then
            exit 1
          fi
      - name: Validate Next TypeScript
        run: npm run typecheck --prefix next-app
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify native routes, compatibility and browser workflow
        run: npm run smoke --prefix next-app
